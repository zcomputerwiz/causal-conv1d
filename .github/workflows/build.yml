name: Build wheels

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The runner to use for the build"
        required: true
        type: string
        default: windows-2022
      python-version:
        description: "The Python version to use for the build"
        required: true
        type: string
        default: "3.12"
      cuda-version:
        description: "The CUDA version to use for the build"
        required: true
        type: string
        default: "12.8.0"
      cuda-archs:
        description: "CUDA architectures, e.g. 80 for Ampere/Ada; separate multiple values with semicolons"
        required: true
        type: string
        default: "80"
      torch-version:
        description: "The PyTorch version to use for the build"
        required: true
        type: string
        default: "2.11.0"
      torch-pre:
        description: "Use PyTorch pre-release / nightly index (auto-enabled for 2.11+ or dev)"
        required: false
        type: boolean
        default: false
      cxx11_abi:
        description: "Enable torch flag C++11 ABI (TRUE/FALSE)"
        required: true
        type: string
        default: "TRUE"
      upload-to-release:
        description: "Upload wheel to this release"
        required: false
        type: boolean
        default: false
      release-version:
        description: "Upload wheel to this release (leave empty for current commit)"
        required: false
        type: string
        default: ""

jobs:
  build-wheels:
    uses: ./.github/workflows/_build.yml
    with:
      runs-on: ${{ inputs.runs-on }}
      python-version: ${{ inputs.python-version }}
      cuda-version: ${{ inputs.cuda-version }}
      cuda-archs: ${{ inputs.cuda-archs }}
      torch-version: ${{ inputs.torch-version }}
      torch-pre: ${{ inputs.torch-pre }}
      cxx11_abi: ${{ inputs.cxx11_abi }}
      upload-to-release: ${{ inputs.upload-to-release }}
      release-version: ${{ inputs.release-version }}
