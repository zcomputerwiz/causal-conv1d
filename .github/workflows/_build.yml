name: ~Build wheel template

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner to use for the build"
        required: true
        type: string
      python-version:
        description: "The Python version to use for the build"
        required: true
        type: string
      cuda-version:
        description: "The CUDA version to use for the build"
        required: true
        type: string
      cuda-archs:
        description: "CUDA architectures, e.g. 80 for Ampere/Ada; separate multiple values with semicolons"
        required: false
        type: string
        default: "80"
      torch-version:
        description: "The PyTorch version to use for the build"
        required: true
        type: string
      torch-pre:
        description: "Use PyTorch pre-release / nightly index (auto-enabled for 2.11+ or dev)"
        required: false
        type: boolean
        default: false
      cxx11_abi:
        description: "The C++11 ABI to use for the build"
        required: true
        type: string
      upload-to-release:
        description: "Upload wheel to this release"
        required: false
        type: boolean
        default: false
      release-version:
        description: "Upload wheel to this release"
        required: false
        type: string

defaults:
  run:
    shell: bash

jobs:
  build-wheel:
    runs-on: ${{ inputs.runs-on }}
    name: Build wheel (${{ inputs.release-version }}-${{ inputs.python-version }}-${{ inputs.cuda-version }}-${{ inputs.cuda-archs }}-${{ inputs.torch-version }}-${{ inputs.cxx11_abi }})
    steps:
      - name: Enable long paths in Windows and Git
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-version || github.sha }}
          submodules: recursive

      - name: Configure Distutils for MSVC
        if: runner.os == 'Windows'
        run: |
          echo "DISTUTILS_USE_SDK=1" >> "$GITHUB_ENV"

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Set up MSVC Dev Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Set CUDA and PyTorch versions
        run: |
          echo "MATRIX_CUDA_VERSION=$(echo ${{ inputs.cuda-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV
          echo "MATRIX_TORCH_VERSION=$(echo ${{ inputs.torch-version }} | awk -F \. {'print $1 "." $2'})" >> $GITHUB_ENV
          echo "WHEEL_CUDA_VERSION=$(echo ${{ inputs.cuda-version }} | awk -F \. {'print $1'})" >> $GITHUB_ENV
          echo "MATRIX_PYTHON_VERSION=$(echo ${{ inputs.python-version }} | awk -F \. {'print $1 $2'})" >> $GITHUB_ENV

      - name: Free up disk space
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

      - name: Set up swap space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 10

      - name: Install CUDA for Windows ${{ inputs.cuda-version }}
        if: inputs.cuda-version != 'cpu' && runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-win
        with:
          cuda: ${{ inputs.cuda-version }}
          method: "network"

      - name: Install CUDA for Linux ${{ inputs.cuda-version }}
        if: inputs.cuda-version != 'cpu' && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-linux
        with:
          cuda: ${{ inputs.cuda-version }}
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc"]'

      - name: Install PyTorch ${{ inputs.torch-version }}+cu${{ inputs.cuda-version }}
        run: |
          pip install --upgrade pip
          pip install typing-extensions==4.12.2
          export TORCH_CUDA_VERSION=$(python -c "from os import environ as env; \
            available = { \
              '2.6': [118, 124, 126], \
              '2.7': [118, 126, 128], \
              '2.8': [126, 128, 129], \
              '2.9': [126, 128, 130], \
              '2.10': [126, 128, 130], \
              '2.11': [124, 126, 128], \
            }[env['MATRIX_TORCH_VERSION']]; \
            sys_cuda = int(env['MATRIX_CUDA_VERSION']); \
            print(max(v for v in available if v <= sys_cuda))" \
          )
          USE_PRE="false"
          if [ "${{ inputs.torch-pre }}" = "true" ] || [[ "${{ inputs.torch-version }}" == *"dev"* ]] || [[ "${{ inputs.torch-version }}" == *"a"* ]] || [[ "${{ inputs.torch-version }}" == *"rc"* ]]; then
            USE_PRE="true"
          fi

          if [ "$USE_PRE" = "true" ]; then
            INDEX_URL="https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}"
            echo "Installing PyTorch from nightly channel: ${INDEX_URL}"
            pip install --no-cache-dir --pre "torch==${{ inputs.torch-version }}" --index-url "${INDEX_URL}" || \
            pip install --no-cache-dir --pre "torch>=${{ inputs.torch-version }}" --index-url "${INDEX_URL}"
          else
            echo "Installing PyTorch from release channel: https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION}"
            pip install --no-cache-dir torch==${{ inputs.torch-version }} --index-url https://download.pytorch.org/whl/cu${TORCH_CUDA_VERSION} || \
            pip install --no-cache-dir --pre torch==${{ inputs.torch-version }} --index-url https://download.pytorch.org/whl/test/cu${TORCH_CUDA_VERSION} || \
            pip install --no-cache-dir --pre "torch>=${{ inputs.torch-version }}a0, <2.12.0" --index-url https://download.pytorch.org/whl/nightly/cu${TORCH_CUDA_VERSION}
          fi
          nvcc --version
          python --version
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torch; print('CUDA:', torch.version.cuda)"
          python -c "from torch.utils import cpp_extension; print (cpp_extension.CUDA_HOME)"

      - name: Verify action-provided CUDA installation
        if: inputs.cuda-version != 'cpu' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Requested CUDA version (reporting only): ${{ inputs.cuda-version }}"

          if ([string]::IsNullOrWhiteSpace($env:CUDA_PATH)) {
            throw "Jimver/cuda-toolkit did not provide CUDA_PATH."
          }

          $cudaPath = [IO.Path]::GetFullPath($env:CUDA_PATH).TrimEnd([char[]]@('\', '/'))
          $hostConfig = Join-Path $cudaPath "include/crt/host_config.h"
          $nvcc = Join-Path $cudaPath "bin/nvcc.exe"
          foreach ($requiredPath in @($hostConfig, $nvcc)) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required CUDA file is missing: $requiredPath (CUDA_PATH=$cudaPath)"
            }
            Write-Host "Verified CUDA file: $requiredPath"
          }

          $torchCudaHome = python -c "from torch.utils.cpp_extension import CUDA_HOME; print(CUDA_HOME or '')"
          $torchCudaHome = "$torchCudaHome".Trim()
          if ([string]::IsNullOrWhiteSpace($torchCudaHome)) {
            throw "PyTorch did not detect CUDA_HOME. CUDA_PATH='$cudaPath'; torch.utils.cpp_extension.CUDA_HOME='$torchCudaHome'"
          }
          $torchCudaHome = [IO.Path]::GetFullPath($torchCudaHome).TrimEnd([char[]]@('\', '/'))
          if (-not $cudaPath.Equals($torchCudaHome, [StringComparison]::OrdinalIgnoreCase)) {
            throw "CUDA installation mismatch: CUDA_PATH='$cudaPath'; torch.utils.cpp_extension.CUDA_HOME='$torchCudaHome'"
          }
          Write-Host "CUDA_PATH matches torch.utils.cpp_extension.CUDA_HOME: $cudaPath"

      - name: Build wheel
        id: build_wheel
        run: |
          pip install setuptools==75.8.0
          pip install ninja packaging wheel
          export PATH=/usr/local/nvidia/bin:/usr/local/nvidia/lib64:$PATH
          export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:/usr/local/cuda/lib64:$LD_LIBRARY_PATH
          if [ "$RUNNER_OS" = "Windows" ]; then
            vctools_dir="$(cygpath -u "${VCToolsInstallDir}")"
            vctools_dir="${vctools_dir%/}"
            msvc_bin="${vctools_dir}/bin/Host${VSCMD_ARG_HOST_ARCH}/${VSCMD_ARG_TGT_ARCH}"
            if [ ! -x "$msvc_bin/link.exe" ]; then
              echo "::error::MSVC linker is missing: $msvc_bin/link.exe"
              exit 1
            fi
            export PATH="$msvc_bin:$PATH"
            echo "Using MSVC linker: $(command -v link.exe)"
          fi
          export MAX_JOBS=2
          export NVCC_THREADS=2
          export CAUSAL_CONV1D_FORCE_BUILD="TRUE"
          export CAUSAL_CONV1D_FORCE_CXX11_ABI=${{ inputs.cxx11_abi }}
          export CAUSAL_CONV1D_CUDA_ARCHS='${{ inputs.cuda-archs }}'

          EXIT_CODE=0
          python setup.py bdist_wheel --dist-dir=dist || EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            tmpname=cu${WHEEL_CUDA_VERSION}torch${MATRIX_TORCH_VERSION}cxx11abi${{ inputs.cxx11_abi }}
            wheel_name=$(ls dist/*whl | xargs -n 1 basename | sed "s/-/+$tmpname-/2")
            ls dist/*whl |xargs -I {} mv {} dist/${wheel_name}
            echo "wheel_name=${wheel_name}" >> $GITHUB_ENV
          fi

          echo "build_exit_code=$EXIT_CODE" | tee -a "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      - name: Log build failure diagnostics
        if: always() && steps.build_wheel.outputs.build_exit_code != 0
        run: |
          echo "=== Workspace Directory Listing ==="
          ls -la ./
          if [ -d "build" ]; then
            echo "=== Build Directory Listing ==="
            ls -la build/
            find build -name "*.log" -o -name ".ninja_log" 2>/dev/null | while read -r logfile; do
              echo "=== Dumping $logfile ==="
              tail -n 100 "$logfile" || true
            done
          fi

      - name: Log Built Wheels
        if: always() && steps.build_wheel.outputs.build_exit_code == 0
        run: |
          ls dist

      - name: Upload wheel to artifacts
        if: always() && steps.build_wheel.outputs.build_exit_code == 0
        uses: actions/upload-artifact@v4
        with:
          name: causal-conv1d
          path: ${{ github.workspace }}/dist/${{ env.wheel_name }}

      - name: Upload Release Asset
        if: inputs.upload-to-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.release-version }}" "./dist/${{ env.wheel_name }}" --clobber
